<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="An interactive walkthrough of DARe's Transport Performance & Risk Analysis Framework (TPRAF)." />
  <title>TPRAF Interactive Diagram — DARe</title>
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" />
  <link rel="icon" href="assets/icons/favicon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/icons/favicon-192.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- LAYOUT:HEADER — identical on every page; becomes the header block
       inside resources/views/layouts/app.blade.php when this moves to Laravel -->
  <header class="site-header">
    <div class="brand">
      <img class="logo" src="assets/icons/logo.svg" alt="DARe — Decarbonised, Adaptable, Resilient Transport Infrastructures Hub" />
      <span class="brand-subtitle">TPRAF</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>
  <!-- /LAYOUT:HEADER -->

  <!-- PAGE:CONTENT — becomes @section('content') in resources/views/diagram.blade.php -->
  <div class="diagram-toolbar" id="diagram-toolbar">
    <button class="level-tab" data-view="simple" aria-selected="true">Level 1 &middot; Simple</button>
    <button class="level-tab" data-view="extended">Level 1 &middot; Extended</button>
    <button class="level-tab" data-view="dsp">Level 2 &middot; DSP</button>
    <button class="level-tab" data-view="imp">Level 2 &middot; IMP</button>
  </div>

  <h1 class="diagram-title" id="diagram-title"></h1>
  <p class="diagram-subtitle" id="diagram-subtitle"></p>

  <div class="diagram-guide" id="diagram-guide">
    <button type="button" class="diagram-guide-toggle" id="diagram-guide-toggle" aria-expanded="true" aria-controls="diagram-guide-body">
      <span class="diagram-guide-toggle-label">
        <svg class="diagram-guide-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.15" fill="currentColor"/></svg>
        How to explore this diagram
      </span>
      <svg class="diagram-guide-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 7.5 10 12l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="diagram-guide-body" id="diagram-guide-body"></div>
  </div>

  <div class="process-toggle" id="process-toggle" role="group" aria-label="Filter by process" hidden>
    <button type="button" id="process-btn-all" aria-pressed="true">Show all</button>
    <button type="button" id="process-btn-dsp" aria-pressed="false">DSP only</button>
    <button type="button" id="process-btn-imp" aria-pressed="false">IMP only</button>
  </div>

  <!-- Walkthrough. Plays this view's own reading order (content.js `tour`) as
       an animated pass through the diagram: each step lights up, then a glow
       travels along the arrow into the next one. Sits in flow above the
       diagram so starting/stopping it can never move the diagram itself. -->
  <div class="diagram-tour" id="diagram-tour">
    <button type="button" class="tour-play" id="tour-play">
      <span class="tour-play-icon" aria-hidden="true"></span>
      <span id="tour-play-label">Play walkthrough</span>
    </button>
    <p class="tour-caption" id="tour-caption" aria-live="polite">Watch the diagram complete itself, step by step.</p>
    <button type="button" class="tour-btn" id="tour-restart" hidden>Restart</button>
    <button type="button" class="tour-btn" id="tour-stop" hidden>Stop</button>
  </div>

  <p class="scroll-hint">&larr; Swipe or drag to explore the full diagram &rarr;</p>
  <div class="diagram-viewport">
    <div class="zoom-controls" role="group" aria-label="Zoom diagram">
      <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
      <span class="zoom-level" id="zoom-level">100%</span>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <div class="zoom-divider"></div>
      <button type="button" id="zoom-fit" aria-label="Fit diagram to screen">Fit</button>
      <button type="button" id="zoom-reset" aria-label="Reset zoom">Reset</button>
    </div>
    <div class="diagram-stage-wrap" id="diagram-stage-wrap">
      <div class="zoom-sizer" id="zoom-sizer">
        <div class="diagram-crop" id="diagram-crop">
          <div class="diagram-stage" id="diagram-stage">
            <svg class="arrows-layer" id="arrows-layer"></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sits below the diagram, not above it: the simple form should be read
       first and this offered as the way on, rather than pulling visitors
       past the thing they came for. Populated per view from content.js. -->
  <p class="view-next" id="view-next" hidden><a class="inline-link" id="view-next-link" href="#"></a></p>

  <!-- Sits below the diagram on purpose — opening/closing this can be a few
       hundred px of text, and having it above the diagram meant toggling
       DSP/IMP shoved the diagram (and whatever the visitor was looking at)
       down the page, off-screen on a phone. Down here it can never move
       the diagram at all. -->
  <div class="process-panel" id="process-panel" hidden>
    <h2 id="process-panel-title"></h2>
    <p id="process-panel-text"></p>
    <a class="process-panel-explore" id="process-panel-explore" href="#" hidden></a>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <span class="placeholder-note" id="modal-placeholder-note" hidden>Awaiting final text from DARe</span>
      <br />
      <a class="modal-handbook-link" id="modal-handbook-link" href="#" hidden>Take me to the Handbook &rarr;</a>
    </div>
  </div>

  <!-- /PAGE:CONTENT -->

  <!-- LAYOUT:FOOTER — identical on every page, same as the header above -->
  <footer class="site-footer">
    <div class="container">
      <p class="footer-label">Funded by &middot; Led by</p>
      <img class="footer-lockup" src="assets/img/funders-partners.png" alt="Funders and partners of the DARe Hub" width="2160" height="103" loading="lazy" />
      <p class="footer-line">DARe &middot; Decarbonised, Adaptable, Resilient Transport Infrastructures Hub &middot; <a href="https://dare.ac.uk">dare.ac.uk</a></p>
    </div>
  </footer>
  <!-- /LAYOUT:FOOTER -->

  <!-- DATA SOURCE — in Laravel this <script src="content.js"> tag is replaced by
       one inline line the Blade view prints:
         <script>const TPRAF_CONTENT = @json($tprafContent);</script>
       That PHP array would come from the database instead of this file.
       app.js needs ZERO changes either way — it only ever reads the
       TPRAF_CONTENT global, never content.js by name. -->
  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
