<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Rain falling on a district, with flood water gathering in the low ground"><title>Rain falling on a district, with flood water gathering in the low ground</title><style>text{font-family:Calibri,"Segoe UI",Arial,sans-serif;fill:#00295e}
