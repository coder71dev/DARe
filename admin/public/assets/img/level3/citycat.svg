    .w{transform-box:fill-box;transform-origin:50% 100%;animation:fill 6s ease-in-out infinite}
    @keyframes fill{0%{transform:scaleY(.05)}55%,80%{transform:scaleY(1)}100%{transform:scaleY(.05)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="180" fill="#f2f6fb"/>
