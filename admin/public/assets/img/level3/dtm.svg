<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A cross-section of hilly ground with a marker reading its height"><title>A cross-section of hilly ground with a marker reading its height</title><style>text{font-family:Calibri,"Segoe UI",Arial,sans-serif;fill:#00295e}
    .probe{animation:scan 5s ease-in-out infinite alternate}
    .drop{animation:read 5s ease-in-out infinite alternate}
    @keyframes scan{from{transform:translateX(0)}to{transform:translateX(220px)}}
    @keyframes read{from{opacity:.35}50%{opacity:1}to{opacity:.35}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="180" fill="#f2f6fb"/>
    <path d="M0 150 C40 150 55 92 100 92 S150 128 190 112 S250 60 320 78 V180 H0Z" fill="#0096ff" opacity=".22"/>
    <path d="M0 158 C50 158 62 110 108 110 S158 140 198 126 S256 84 320 98 V180 H0Z" fill="#0096ff" opacity=".4"/>
    <path d="M0 168 C60 168 72 128 118 128 S166 152 206 142 S262 108 320 120 V180 H0Z" fill="#00295e" opacity=".85"/>
    <g class="probe">
      <line x1="50" y1="20" x2="50" y2="150" stroke="#00295e" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="50" cy="20" r="5" fill="#5ecf70" stroke="#00295e" stroke-width="1.5"/>
    </g>
    <text x="14" y="22" font-size="13" font-weight="700">Height of the ground</text>
    <text x="14" y="38" font-size="11" opacity=".7">one reading per point on the map</text>
    </svg>