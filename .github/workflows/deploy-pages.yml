name: Deploy site/ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Gives the workflow permission to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment in flight at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages if it isn't already active (build type: Actions).
          enablement: true

      # Upload the static site/ directory as the Pages artifact.
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4